[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "ornotto"
dynamic = ["version"]
description = "Typed decisions: one Python API over local inference engines and OpenRouter decision models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "FontLab Ltd." }]
keywords = ["decision", "classification", "llama.cpp", "gguf", "pydantic-ai", "system-one", "structured-output"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.25",
    "pydantic>=2.7",
    "fire>=0.6",
]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim[typesafe]>=2.48", "httpx2"]
laya-mlx = ["laya-mlx>=0.3,<0.4; python_version >= '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'"]

transformers = ["torch>=2.4; python_version >= '3.11'", "transformers>=5.18,<6; python_version >= '3.11'"]
onnx = ["onnxruntime>=1.26; python_version >= '3.11'", "transformers>=5.18,<6; python_version >= '3.11'", "numpy>=1.26"]
clef = ["torch>=2.4; python_version >= '3.11'", "gguf>=0.18", "safetensors>=0.6", "numpy>=1.26", "filelock>=3.12"]
clef-mlx = ["mlx-lm>=0.32,<0.33; python_version >= '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-vlm>=0.7.4,<0.8; python_version >= '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'"]
clm = ["torch>=2.4; python_version >= '3.11'", "numpy>=1.26", "requests>=2.28", "llama-cpp-python>=0.3.36"]

bosun = ["llama-cpp-python>=0.3.36", "numpy>=1.26"]

[project.scripts]
ornotto = "ornotto.__main__:main"

[project.urls]
Homepage = "https://fontlab.org/ornotto/"
Source = "https://github.com/fontlaborg/ornotto"
Issues = "https://github.com/fontlaborg/ornotto/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ornotto/_version.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "licenses", "hatch_build.py", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/ornotto"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pydantic-ai-slim[typesafe]>=2.48"]
docs = ["properdocs>=1.6.7", "mkdocs-materialx>=10.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["engine: runs a real inference engine (needs built binaries and model downloads)"]
addopts = "-m 'not engine'"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
