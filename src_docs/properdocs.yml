# this_file: src_docs/properdocs.yml
site_name: ornotto
site_description: "Typed decisions on local models: dohnuts, pcdServer, and the ornotto Python package. Benchmarks against jev."
site_url: https://fontlab.org/ornotto/
site_author: Fontlab Ltd.
repo_url: https://github.com/fontlaborg/ornotto
repo_name: fontlaborg/ornotto
edit_uri: edit/main/src_docs/md/
copyright: Copyright &copy; 2026 Fontlab Ltd. Text and data CC BY 4.0, code Apache-2.0.

docs_dir: md
site_dir: ../docs
use_directory_urls: true
exclude_docs: |
  tables/

theme:
  name: materialx
  custom_dir: overrides
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    - scheme: default
      primary: black
      accent: red

nav:
  - Home: index.md
  - Results:
      - "Explore speed and accuracy": results/explorer.md
      - "Results: the short version": results/tldr.md
      - "Results: every table": results/details.md
  - Book:
      - Concepts:
          - 1. Deciding, not generating: 01-deciding.md
          - 2. The shape of a decision: 02-decisions.md
          - 3. Ways to read an answer: 03-engines.md
          - 4. Dedicated, fine-tuned and vanilla models: 04-models.md
      - Method and analysis:
          - 5. How we measured: 05-method.md
          - 6. Results: 06-results.md
          - 7. Quantization and size: 07-quantization.md
          - 8. Speed, memory and caching: 08-speed.md
          - 9. Confidence and fallback: 09-confidence.md
  - Use ornotto:
      - 10. The ornotto package: 10-package.md
      - 11. Typed decisions and pydantic-ai: 11-typed.md
      - 12. Choosing, building and contributing: 12-choosing.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: [md]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
  - css/site.css
  - css/benchmark.13b021a7aaa8.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
  - js/tables.js
  - js/benchmark-math.da51227706b3.js
  - js/benchmark.e0c1a4155a7f.js
